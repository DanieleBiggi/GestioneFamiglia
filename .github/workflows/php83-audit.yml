name: Audit sintassi PHP 8.3
on:
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/php83-audit.yml'
  push:
    branches:
      - 'audit/php83-compatibility'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Controlla tutti i file PHP
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Test nomi delle date italiane
        run: php tests/php83_dates.php
